
name: Build ReL TV Storyboard Studio V4 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "V4/**"
      - ".github/workflows/android-build-v4.yml"

permissions:
  contents: read

jobs:
  build-v4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify V4 source files
        run: |
          test -f V4/settings.gradle
          test -f V4/build.gradle
          test -f V4/app/build.gradle
          test -f V4/app/src/main/AndroidManifest.xml
          test -f V4/app/src/main/java/tv/reltv/storyboard/MainActivity.java
          test -f V4/app/src/main/assets/index.html
          echo "Semua file utama V4 ditemukan."

      - 
      - name: Validate AndroidManifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "V4/app/src/main/AndroidManifest.xml"
          try:
              ET.parse(path)
              print("Manifest XML valid.")
          except ET.ParseError as e:
              print(f"Manifest XML error: {e}")
              with open(path, "r", encoding="utf-8-sig") as f:
                  for n, line in enumerate(f, 1):
                      print(f"{n}: {line.rstrip()}")
              raise
          PY

      - name: Build V4 debug APK
        run: gradle -p V4 assembleDebug --stacktrace


      - name: Upload V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: ReL-TV-Storyboard-Studio-V4-APK
          path: V4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
