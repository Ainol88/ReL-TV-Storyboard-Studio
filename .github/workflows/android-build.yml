
name: Build ReL TV Storyboard Studio APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V3.2 project ZIP
        run: |
          ZIP="ReL-TV-Storyboard-Studio-V3.2-Photo-Prompt-Character-Upload.zip"
          test -f "$ZIP" || { echo "ZIP V3.2 tidak ditemui"; exit 1; }
          mkdir -p /tmp/rel-project
          unzip -q "$ZIP" -d /tmp/rel-project
          test -f /tmp/rel-project/app/src/main/assets/index.html
          test -f /tmp/rel-project/app/build.gradle
          rsync -a --exclude='.github/' /tmp/rel-project/ ./

      - name: Verify V3.2 features
        run: |
          grep -q 'Prompt Foto' app/src/main/assets/index.html
          grep -q 'characterPhoto' app/src/main/assets/index.html
          echo "Ciri V3.2 ditemui."

      - name: Fix Android file chooser import
        run: |
          sed -i 's/import android\.webkit\.FileChooserParams;/import android.webkit.WebChromeClient.FileChooserParams;/' app/src/main/java/tv/reltv/storyboard/MainActivity.java
          grep -q 'import android.webkit.WebChromeClient.FileChooserParams;' app/src/main/java/tv/reltv/storyboard/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReL-TV-Storyboard-Studio-V3.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
